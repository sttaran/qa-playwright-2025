name: "DC Automated tests with Playwright"

on:
  workflow_dispatch:
  pull_request:
      types: [ opened, synchronize ]


jobs:
  playwright-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Set up Docker Compose"
        uses: docker/setup-compose-action@v1
      - name: "run tests"
        run: docker-compose up --exit-code-from auto-tests
        env:
          BASE_URL: ${{secrets.BASE_URL}}
          HTTP_CREDENTIALS_USERNAME: ${{secrets.HTTP_CREDENTIALS_USERNAME}}
          HTTP_CREDENTIALS_PASSWORD: ${{secrets.HTTP_CREDENTIALS_PASSWORD}}
      - name: "Upload tests report to artifacts"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: playwright-report/
          retention-days: 3
